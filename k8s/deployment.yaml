apiVersion: apps/v1
kind: Deployment
metadata:
  name: stage1-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: stage1-demo
  template:
    metadata:
      labels:
        app: stage1-demo
    spec:
      containers:
      - name: stage1-demo
        image: ghcr.io/pavlostheone/stage1-demo:latest
        imagePullPolicy: Always
        ports:
          - containerPort: 8000
